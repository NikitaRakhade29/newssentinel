<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <rect width="1200" height="675" fill="#0e1117" rx="10"/>
  
  <!-- Header -->
  <text x="30" y="45" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="bold">📰 NewsSentinel Market Intelligence Console</text>
  <text x="30" y="70" fill="#8b949e" font-family="sans-serif" font-size="13">HackerNews Live Stream → Delta Lakehouse → dbt Analytics → LangChain AI RAG</text>
  <rect x="1040" y="25" width="130" height="35" fill="#238636" rx="6"/>
  <text x="1055" y="48" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold">🔄 Refresh Data</text>

  <!-- Metric Cards -->
  <!-- Card 1 -->
  <rect x="30" y="95" width="265" height="85" fill="#161b22" stroke="#30363d" rx="8"/>
  <text x="45" y="120" fill="#8b949e" font-family="sans-serif" font-size="12">Total Unique Live Stories</text>
  <text x="45" y="160" fill="#58a6ff" font-family="sans-serif" font-size="28" font-weight="bold">70</text>

  <!-- Card 2 -->
  <rect x="325" y="95" width="265" height="85" fill="#161b22" stroke="#30363d" rx="8"/>
  <text x="340" y="120" fill="#8b949e" font-family="sans-serif" font-size="12">Avg Sentiment Score</text>
  <text x="340" y="160" fill="#58a6ff" font-family="sans-serif" font-size="28" font-weight="bold">0.024</text>

  <!-- Card 3 -->
  <rect x="620" y="95" width="265" height="85" fill="#161b22" stroke="#30363d" rx="8"/>
  <text x="635" y="120" fill="#8b949e" font-family="sans-serif" font-size="12">Positive Signals</text>
  <text x="635" y="160" fill="#2ecc71" font-family="sans-serif" font-size="28" font-weight="bold">16</text>

  <!-- Card 4 -->
  <rect x="915" y="95" width="255" height="85" fill="#161b22" stroke="#30363d" rx="8"/>
  <text x="930" y="120" fill="#8b949e" font-family="sans-serif" font-size="12">Negative Risk Signals</text>
  <text x="930" y="160" fill="#e74c3c" font-family="sans-serif" font-size="28" font-weight="bold">7</text>

  <!-- Charts Row -->
  <!-- Pie Chart Card -->
  <rect x="30" y="200" width="450" height="250" fill="#161b22" stroke="#30363d" rx="8"/>
  <text x="50" y="230" fill="#ffffff" font-family="sans-serif" font-size="15" font-weight="bold">📊 Sentiment Distribution</text>
  <!-- Donut SVG -->
  <circle cx="200" cy="340" r="70" fill="none" stroke="#95a5a6" stroke-width="40" stroke-dasharray="295 440"/>
  <circle cx="200" cy="340" r="70" fill="none" stroke="#2ecc71" stroke-width="40" stroke-dasharray="100 440" stroke-dashoffset="-295"/>
  <circle cx="200" cy="340" r="70" fill="none" stroke="#e74c3c" stroke-width="40" stroke-dasharray="45 440" stroke-dashoffset="-395"/>
  <!-- Legend -->
  <rect x="320" y="300" width="12" height="12" fill="#2ecc71" rx="2"/><text x="340" y="311" fill="#8b949e" font-family="sans-serif" font-size="12">Positive (22.9%)</text>
  <rect x="320" y="330" width="12" height="12" fill="#95a5a6" rx="2"/><text x="340" y="341" fill="#8b949e" font-family="sans-serif" font-size="12">Neutral (67.1%)</text>
  <rect x="320" y="360" width="12" height="12" fill="#e74c3c" rx="2"/><text x="340" y="371" fill="#8b949e" font-family="sans-serif" font-size="12">Negative (10.0%)</text>

  <!-- Bar Chart Card -->
  <rect x="500" y="200" width="670" height="250" fill="#161b22" stroke="#30363d" rx="8"/>
  <text x="520" y="230" fill="#ffffff" font-family="sans-serif" font-size="15" font-weight="bold">🔥 Top Upvoted Tech Stories</text>
  <!-- Bar 1 -->
  <text x="520" y="270" fill="#8b949e" font-family="sans-serif" font-size="11">Our position on open-weights models</text>
  <rect x="760" y="258" width="340" height="16" fill="#58a6ff" rx="3"/>
  <text x="1110" y="271" fill="#ffffff" font-family="sans-serif" font-size="11">730</text>

  <!-- Bar 2 -->
  <text x="520" y="305" fill="#8b949e" font-family="sans-serif" font-size="11">Judge Rejects Google's Attempt to DMCA...</text>
  <rect x="760" y="293" width="180" height="16" fill="#58a6ff" rx="3"/>
  <text x="950" y="306" fill="#ffffff" font-family="sans-serif" font-size="11">293</text>

  <!-- Bar 3 -->
  <text x="520" y="340" fill="#8b949e" font-family="sans-serif" font-size="11">Decathlon Germany adds Wero payment...</text>
  <rect x="760" y="328" width="160" height="16" fill="#58a6ff" rx="3"/>
  <text x="930" y="341" fill="#ffffff" font-family="sans-serif" font-size="11">274</text>

  <!-- Bar 4 -->
  <text x="520" y="375" fill="#8b949e" font-family="sans-serif" font-size="11">Netflix employee fired for sharing personal...</text>
  <rect x="760" y="363" width="150" height="16" fill="#58a6ff" rx="3"/>
  <text x="920" y="376" fill="#ffffff" font-family="sans-serif" font-size="11">257</text>

  <!-- Table Row -->
  <rect x="30" y="470" width="1140" height="180" fill="#161b22" stroke="#30363d" rx="8"/>
  <text x="50" y="500" fill="#ffffff" font-family="sans-serif" font-size="15" font-weight="bold">📋 Real-Time News Stream Feed</text>
  <!-- Table Header -->
  <line x1="50" y1="515" x2="1150" y2="515" stroke="#30363d"/>
  <text x="50" y="533" fill="#8b949e" font-family="sans-serif" font-size="12" font-weight="bold">Title</text>
  <text x="650" y="533" fill="#8b949e" font-family="sans-serif" font-size="12" font-weight="bold">Author</text>
  <text x="800" y="533" fill="#8b949e" font-family="sans-serif" font-size="12" font-weight="bold">Upvotes</text>
  <text x="920" y="533" fill="#8b949e" font-family="sans-serif" font-size="12" font-weight="bold">Sentiment</text>

  <!-- Row 1 -->
  <line x1="50" y1="545" x2="1150" y2="545" stroke="#21262d"/>
  <text x="50" y="565" fill="#ffffff" font-family="sans-serif" font-size="12">Using an open model feels surprisingly good</text>
  <text x="650" y="565" fill="#8b949e" font-family="sans-serif" font-size="12">msaltz</text>
  <text x="800" y="565" fill="#ffffff" font-family="sans-serif" font-size="12">207</text>
  <rect x="920" y="552" width="60" height="18" fill="#2ecc71" rx="4"/>
  <text x="930" y="565" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="bold">Positive</text>

  <!-- Row 2 -->
  <line x1="50" y1="580" x2="1150" y2="580" stroke="#21262d"/>
  <text x="50" y="600" fill="#ffffff" font-family="sans-serif" font-size="12">Residential Proxies Are a National Security Threat</text>
  <text x="650" y="600" fill="#8b949e" font-family="sans-serif" font-size="12">joshbetz</text>
  <text x="800" y="600" fill="#ffffff" font-family="sans-serif" font-size="12">62</text>
  <rect x="920" y="587" width="60" height="18" fill="#e74c3c" rx="4"/>
  <text x="930" y="600" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="bold">Negative</text>
</svg>
